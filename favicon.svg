<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark rounded-square background -->
  <rect x="3" y="3" width="58" height="58" rx="10" fill="#0f172a"/>
  <!-- Flat-top hexagon: top and bottom edges horizontal -->
  <polygon points="53.0,32.0 42.5,50.2 21.5,50.2 11.0,32.0 21.5,13.8 42.5,13.8"
           fill="none" stroke="#f8fafc" stroke-width="3.2" stroke-linejoin="miter"/>
  <!-- Sky-blue X connecting opposite hexagon vertices -->
  <line x1="42.5" y1="13.8" x2="21.5" y2="50.2"
        stroke="#38bdf8" stroke-width="4.2" stroke-linecap="butt"/>
  <line x1="21.5" y1="13.8" x2="42.5" y2="50.2"
        stroke="#38bdf8" stroke-width="4.2" stroke-linecap="butt"/>
</svg>