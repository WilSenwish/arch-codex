<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark rounded-square background -->
  <rect x="3" y="3" width="58" height="58" rx="10" fill="#0f172a"/>
  <!-- Taiji body -->
  <g transform="translate(0,0)">
    <!-- Full white circle -->
    <circle cx="32" cy="32" r="20" fill="#f8fafc"/>
    <!-- Right half = sky-blue -->
    <path d="M 32 12 A 20 20 0 0 1 32 52 Z" fill="#38bdf8"/>
    <!-- Top semicircle (bulges right into sky side → white) -->
    <circle cx="32" cy="22.0" r="10.0" fill="#f8fafc"/>
    <!-- Bottom semicircle (bulges left into white side → sky) -->
    <circle cx="32" cy="42.0" r="10.0" fill="#38bdf8"/>
    <!-- Dot in sky half (top center) = white -->
    <circle cx="32" cy="22.0" r="3.3333333333333335" fill="#f8fafc"/>
    <!-- Dot in white half (bottom center) = sky -->
    <circle cx="32" cy="42.0" r="3.3333333333333335" fill="#38bdf8"/>
  </g>
</svg>