<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Blue rounded-square base container -->
  <rect x="3" y="3" width="58" height="58" rx="10" fill="#3b82f6"/>
  <!-- Yin-yang: black = slate-900, white = slate-50 -->
  <!-- Full white circle -->
  <circle cx="32" cy="32" r="19.5" fill="#f8fafc"/>
  <!-- Right half = black -->
  <path d="M 32 12.5 A 19.5 19.5 0 0 1 32 51.5 Z" fill="#0f172a"/>
  <!-- Top semicircle bulging right into black side → white -->
  <circle cx="32" cy="22.25" r="9.75" fill="#f8fafc"/>
  <!-- Bottom semicircle bulging left into white side → black -->
  <circle cx="32" cy="41.75" r="9.75" fill="#0f172a"/>
  <!-- Dots: opposite colors in each half -->
  <circle cx="32" cy="22.25" r="3.25" fill="#0f172a"/>
  <circle cx="32" cy="41.75" r="3.25" fill="#f8fafc"/>
</svg>